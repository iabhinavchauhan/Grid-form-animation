<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Numbered Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body,
        html {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: black;
        }

        main {
            height: 100%;
            width: 100%;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 80px);
            grid-auto-rows: 80px;
            transition: all 0.3s ease-in-out;
            gap: 10px;
        }


        .box {
            border: 2px solid red;
            transition: all 0.2s linear;
        }

        .box:hover {
            background-color: red;
        }

        .cont {
            color: white;
            border: 2px solid black;
            background-color: black;
            border-radius: 10px;
            padding: 7px;
            margin: 5px;
            max-width: 300px;
            width: 90%;
            box-shadow: 0 0 5px 5px rgb(30, 30, 30);
            text-align: center;

            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

        }

        .cont input,
        .cont p {
            margin: 10px 0 10px 0;
        }

        .cont h2 {
            color: red;
            margin-top: 30px;
        }

        p,
        a {
            color: white;
            text-decoration: none;
            font-size: small;
        }

        h2:hover {
            color: white;
        }

        button {
            color: white;
            background-color: black;
            border: none;
            padding: 5px;
            width: 100px;
            box-shadow: 0 0 5px 5px rgb(52, 52, 52);
            margin-top: 10px;
            font-weight: bold;
        }

        button:focus {
            color: red;
        }

        a:focus {
            color: blue;
        }

        input {
            background-color: transparent;
            color: white;
            width: 90%;
            height: 30px;
            padding: 5px;
            border: 1px solid red;
            border-radius: 10px;

        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: repeat(auto-fill, 60px);
                grid-auto-rows: 60px;
            }

            .cont h2 {
                font-size: 1.5rem;
            }

            button {
                width: 90px;
            }
        }
    </style>
</head>
